<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panel de Albergue - Receptor</title>
    <link rel="stylesheet" href="assets/css/bulma.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
    <style>
      .bg-base { background-color: #FFBDB0 !important; }
      .texto-rojo { color: #A31F05 !important; }
      .box { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
      #panel-content { display: none; }
    </style>
  </head>
  <body class="bg-base">
    
    <nav class="navbar is-white" style="border-radius: 0 0 15px 15px; margin-bottom: 2rem; padding: 0.5rem 2rem;">
      <div class="navbar-brand">
        <a class="navbar-item texto-rojo has-text-weight-bold is-size-4" href="index.html">
          <i class="fa-solid fa-house-chimney-window mr-2"></i> Inicio
        </a>
      </div>
      <div class="navbar-menu is-active" style="background: transparent; box-shadow: none;">
        <div class="navbar-end">
          <div class="navbar-item">
            <span class="tag is-light is-medium mr-4 texto-rojo">Perfil: Albergue</span>
            <button id="btn-cerrar-sesion" class="button is-danger is-outlined">
              <i class="fa-solid fa-right-from-bracket mr-2"></i> Salir
            </button>
          </div>
        </div>
      </div>
    </nav>

    <section class="section pt-0" id="panel-content">
      <div class="container">
        <h1 class="title texto-rojo mb-6">¡Qué onda! <span id="user-email" class="is-size-4 has-text-weight-normal"></span></h1>
        
        <div class="columns is-variable is-6">
          <div class="column is-6">
            <div class="box p-5" style="height: 100%;">
              <h2 class="title is-4 texto-rojo"><i class="fa-solid fa-satellite-dish mr-2"></i> Radar de Donaciones</h2>
              <div id="contenedor-radar"><p class="has-text-grey has-text-centered mt-5">Cargando...</p></div>
            </div>
          </div>

          <div class="column is-6">
            <div class="box p-5" style="height: 100%; background-color: #fcfcfc;">
              <h2 class="title is-4 texto-rojo"><i class="fa-solid fa-map-location-dot mr-2"></i> Entregas en Camino</h2>
              <div id="contenedor-entregas"><p class="has-text-grey has-text-centered mt-5">Cargando...</p></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
      import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
      import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDRWBaRl4s0pNrf1ni16AP4oVb8iDEVmog",
        authDomain: "bd-concurso.firebaseapp.com",
        projectId: "bd-concurso",
        storageBucket: "bd-concurso.firebasestorage.app",
        messagingSenderId: "944372990629",
        appId: "1:944372990629:web:1bd61c44cf1274eadc034c"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      let currentUser = null;
      let miLat = null, miLng = null;

      function calcularDistancia(lat1, lon1, lat2, lon2) {
        if(!lat1 || !lat2) return "N/A ";
        const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return (R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)))).toFixed(1); 
      }

      function cargarDatos() {
        onSnapshot(collection(db, "alertas"), (snapshot) => {
          const radar = document.getElementById('contenedor-radar');
          const entregas = document.getElementById('contenedor-entregas');
          radar.innerHTML = ''; entregas.innerHTML = '';
          let donacionesDisponibles = 0, donacionesReclamadas = 0;

          snapshot.forEach((docSnap) => {
            const alerta = docSnap.data(); const id = docSnap.id;
            let distancia = calcularDistancia(miLat, miLng, alerta.latitud, alerta.longitud);

            if (!alerta.receptorId) {
              donacionesDisponibles++;
              radar.innerHTML += `
                <div class="box mb-4" style="border: 2px dashed #ffdd57; background-color: #fffdf5;">
                  <div class="columns is-mobile is-vcentered">
                    <div class="column is-8">
                      <p class="has-text-weight-bold is-size-5">${alerta.peso}kg de ${alerta.descripcion}</p>
                      <p class="is-size-7 has-text-grey"><i class="fa-solid fa-shop mr-1"></i> ${alerta.donadorEmail}</p>
                    </div>
                    <div class="column is-4 has-text-right">
                      <span class="tag is-warning is-light mb-2">a ${distancia} km</span><br>
                      <button class="button is-info is-small" onclick="window.reclamarAlerta('${id}')">Reclamar</button>
                    </div>
                  </div>
                </div>`;
            } else if (alerta.receptorId === currentUser.uid) {
              donacionesReclamadas++;
              let infoLogistica = '', btnConfirmar = '';
              let colorBorde = '#48c774';

              if (alerta.estado === 'Entregado') {
                infoLogistica = `<span class="tag is-primary"><i class="fa-solid fa-check-double mr-1"></i> Entregado</span>`;
                colorBorde = '#00d1b2';
              } else if (alerta.estado === 'En camino al albergue') {
                infoLogistica = `<span class="tag is-success mb-2">¡Repartidor en camino!</span>`;
                btnConfirmar = `<button class="button is-primary is-small is-outlined mt-2" onclick="window.confirmarRecepcion('${id}')"><i class="fa-solid fa-clipboard-check mr-1"></i> Confirmar Recepción</button>`;
              } else if (alerta.estado === 'En camino a recolectar') {
                infoLogistica = `<span class="tag is-success is-light mb-2">Repartidor va al súper</span>`;
              } else {
                infoLogistica = `<span class="tag is-warning is-light mb-2"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Buscando voluntario...</span>`;
                colorBorde = '#ffdd57';
              }

              entregas.innerHTML += `
                <div class="box mb-3" style="border-left: 5px solid ${colorBorde};">
                  <div class="columns is-vcentered">
                    <div class="column is-7">
                      <p class="has-text-weight-bold">${alerta.peso}kg de ${alerta.descripcion}</p>
                      <p class="is-size-7 has-text-grey mt-1">De: ${alerta.donadorEmail}</p>
                    </div>
                    <div class="column is-5 has-text-right">${infoLogistica}<br>${btnConfirmar}</div>
                  </div>
                </div>`;
            }
          });
          
          if (donacionesDisponibles === 0) radar.innerHTML = '<p class="has-text-grey has-text-centered mt-5">Por ahora no hay donaciones cercanas.</p>';
          if (donacionesReclamadas === 0) entregas.innerHTML = '<div class="notification is-light is-size-7 mt-5">Cuando reclames una donación, aparecerá aquí.</div>';
        });
      }

      onAuthStateChanged(auth, (user) => {
        if (user) {
          currentUser = user;
          document.getElementById('panel-content').style.display = 'block';
          document.getElementById('user-email').innerText = user.email;

          // Intentamos obtener ubicación, pero cargamos los datos pase lo que pase
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
              (pos) => { miLat = pos.coords.latitude; miLng = pos.coords.longitude; cargarDatos(); },
              (err) => { cargarDatos(); }
            );
          } else { cargarDatos(); }

        } else { window.location.href = "login.html"; }
      });

      window.reclamarAlerta = async function(idAlerta) {
        await updateDoc(doc(db, "alertas", idAlerta), { receptorId: currentUser.uid, receptorEmail: currentUser.email });
      };
      window.confirmarRecepcion = async function(idAlerta) {
        await updateDoc(doc(db, "alertas", idAlerta), { estado: 'Entregado' });
      };
      document.getElementById('btn-cerrar-sesion').addEventListener('click', () => { signOut(auth); });
    </script>
  </body>
</html>
