<script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
      import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
      import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDRWBaRl4s0pNrf1ni16AP4oVb8iDEVmog",
        authDomain: "bd-concurso.firebaseapp.com",
        projectId: "bd-concurso",
        storageBucket: "bd-concurso.firebasestorage.app",
        messagingSenderId: "944372990629",
        appId: "1:944372990629:web:1bd61c44cf1274eadc034c"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      let currentUser = null;
      let miLat = 0, miLng = 0;

      function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371; 
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + 
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return (R * c).toFixed(1); 
      }

      onAuthStateChanged(auth, (user) => {
        if (user) {
          currentUser = user;
          document.getElementById('panel-content').style.display = 'block';
          document.getElementById('user-email').innerText = user.email;

          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
              miLat = pos.coords.latitude;
              miLng = pos.coords.longitude;

              onSnapshot(collection(db, "alertas"), (snapshot) => {
                const radar = document.getElementById('contenedor-radar');
                const entregas = document.getElementById('contenedor-entregas');
                radar.innerHTML = ''; 
                entregas.innerHTML = '';
                let donacionesDisponibles = 0; 
                let donacionesReclamadas = 0;

                snapshot.forEach((docSnap) => {
                  const alerta = docSnap.data();
                  const id = docSnap.id;

                  let distancia = "N/A ";
                  if(alerta.latitud && alerta.longitud) {
                    distancia = calcularDistancia(miLat, miLng, alerta.latitud, alerta.longitud);
                  }

                  // 1. SI NADIE LA HA RECLAMADO (RADAR)
                  if (!alerta.receptorId) {
                    donacionesDisponibles++;
                    radar.innerHTML += `
                      <div class="box mb-4" style="border: 2px dashed #ffdd57; background-color: #fffdf5;">
                        <div class="columns is-mobile is-vcentered">
                          <div class="column is-8">
                            <p class="has-text-weight-bold is-size-5">${alerta.peso}kg de ${alerta.descripcion}</p>
                            <p class="is-size-7 has-text-grey"><i class="fa-solid fa-shop mr-1"></i> ${alerta.donadorEmail}</p>
                            <p class="is-size-7 has-text-danger mt-1"><i class="fa-solid fa-clock mr-1"></i> Límite: ${alerta.tiempoCaducidad} horas</p>
                          </div>
                          <div class="column is-4 has-text-right">
                            <span class="tag is-warning is-light mb-2"><i class="fa-solid fa-location-dot mr-1"></i> a ${distancia} km</span><br>
                            <button class="button is-info is-small" onclick="window.reclamarAlerta('${id}')"><strong>Reclamar</strong></button>
                          </div>
                        </div>
                      </div>
                    `;
                  } 
                  // 2. SI ESTE ALBERGUE LA RECLAMÓ (ENTREGAS)
                  else if (alerta.receptorId === currentUser.uid) {
                    donacionesReclamadas++;
                    
                    let infoLogistica = '';
                    let btnConfirmar = '';

                    // AQUÍ ESTÁ LA CORRECCIÓN: Detectamos cada estado exacto
                    if (alerta.estado === 'Entregado') {
                      infoLogistica = `<span class="tag is-primary mb-2"><i class="fa-solid fa-check-double mr-1"></i> ¡Misión cumplida! Entregado</span>`;
                    } else if (alerta.estado === 'En camino a recolectar' || alerta.estado === 'En camino al albergue') {
                      infoLogistica = `<span class="tag is-success mb-2"><i class="fa-solid fa-car mr-1"></i> ¡Repartidor en camino!</span>`;
                      // Solo mostramos el botón de confirmar si el repartidor ya va hacia el albergue
                      if (alerta.estado === 'En camino al albergue') {
                        btnConfirmar = `<button class="button is-primary is-small is-outlined mt-2" onclick="window.confirmarRecepcion('${id}')"><i class="fa-solid fa-clipboard-check mr-1"></i> Confirmar Recepción</button>`;
                      }
                    } else {
                      infoLogistica = `<span class="tag is-warning is-light mb-2"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Buscando voluntario...</span>`;
                    }

                    // Cambiamos el color del borde si ya se entregó
                    let colorBorde = alerta.estado === 'Entregado' ? '#00d1b2' : '#48c774';

                    entregas.innerHTML += `
                      <div class="box mb-3" style="border-left: 5px solid ${colorBorde};">
                        <div class="columns is-vcentered">
                          <div class="column is-7">
                            <p class="has-text-weight-bold">${alerta.peso}kg de ${alerta.descripcion}</p>
                            <p class="is-size-7 has-text-grey mt-1">De: ${alerta.donadorEmail}</p>
                          </div>
                          <div class="column is-5 has-text-right">
                            ${infoLogistica}<br>${btnConfirmar}
                          </div>
                        </div>
                      </div>
                    `;
                  }
                });
                
                if (donacionesDisponibles === 0) {
                  radar.innerHTML = '<p class="has-text-grey has-text-centered mt-5">Por ahora no hay donaciones cercanas.</p>';
                }
                if (donacionesReclamadas === 0) {
                  entregas.innerHTML = '<div class="notification is-light is-size-7 mt-5"><i class="fa-solid fa-circle-info mr-2"></i> Cuando reclames una donación, aparecerá aquí.</div>';
                }
              });

            }, (error) => {
              alert("Por favor, permite el acceso a tu ubicación para poder calcular la distancia a las donaciones.");
            });
          } else {
            alert("Tu navegador no soporta geolocalización.");
          }
        } else {
          window.location.href = "login.html";
        }
      });

      window.reclamarAlerta = async function(idAlerta) {
        try {
          await updateDoc(doc(db, "alertas", idAlerta), { 
            receptorId: currentUser.uid, 
            receptorEmail: currentUser.email 
          });
        } catch (error) { 
          console.error(error); 
        }
      };

      window.confirmarRecepcion = async function(idAlerta) {
        try {
          await updateDoc(doc(db, "alertas", idAlerta), { estado: 'Entregado' });
          alert("¡Gracias por confirmar! La trazabilidad se ha completado.");
        } catch (error) {
          console.error("Error al confirmar:", error);
        }
      };

      document.getElementById('btn-cerrar-sesion').addEventListener('click', () => { 
        signOut(auth).then(() => { window.location.href = "index.html"; }); 
      });
    </script>
