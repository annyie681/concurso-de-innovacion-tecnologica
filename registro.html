<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="assets/css/bulma.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
    <style>
      .bg-base { background-color: #FFBDB0 !important; }
      .texto-rojo { color: #A31F05 !important; }
      .box { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
  </head>
  <body>
    <section class="hero bg-base is-fullheight">
      <div class="hero-body">
        <div class="container">
          <div class="columns is-centered">
            <div class="column is-4-desktop">
              <div class="box p-6">
                <h1 class="title has-text-centered texto-rojo mb-5">Crear cuenta</h1>
                
                <form id="signup-form">
                  <div class="field">
                    <label class="label">Correo electrónico</label>
                    <div class="control has-icons-left">
                      <input class="input" type="email" id="signup-email" placeholder="ejemplo@correo.com" required>
                      <span class="icon is-small is-left"><i class="fa-solid fa-envelope"></i></span>
                    </div>
                  </div>

                  <div class="field">
                    <label class="label">Contraseña (Mín. 6 letras)</label>
                    <div class="control has-icons-left">
                      <input class="input" type="password" id="signup-password" placeholder="********" required>
                      <span class="icon is-small is-left"><i class="fa-solid fa-lock"></i></span>
                    </div>
                  </div>

                  <!-- NUEVO: Selección de Rol -->
                  <div class="field">
                    <label class="label">¿Qué tipo de cuenta necesitas?</label>
                    <div class="control has-icons-left">
                      <div class="select is-fullwidth">
                        <select id="signup-rol" required>
                          <option value="" disabled selected>Selecciona tu rol...</option>
                          <option value="donador">Donador (Supermercado)</option>
                          <option value="receptor">Receptor (Albergue)</option>
                          <option value="repartidor">Repartidor (Voluntario)</option>
                        </select>
                      </div>
                      <span class="icon is-small is-left"><i class="fa-solid fa-users"></i></span>
                    </div>
                  </div>

                  <div id="signup-message" class="has-text-centered mb-3 mt-4"></div>

                  <div class="field mt-5">
                    <button type="submit" class="button is-info is-fullwidth"><strong>Registrarme</strong></button>
                  </div>
                </form>

                <p class="has-text-centered mt-4">
                  ¿Ya tienes cuenta? <a href="login.html" class="texto-rojo has-text-weight-bold">Inicia sesión</a>
                </p>
                <p class="has-text-centered mt-2">
                  <a href="index.html" class="has-text-grey">Volver al inicio</a>
                </p>

              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Scripts de Firebase actualizados -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
      import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
      // IMPORTAMOS LA BASE DE DATOS
      import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDRWBaRl4s0pNrf1ni16AP4oVb8iDEVmog",
        authDomain: "bd-concurso.firebaseapp.com",
        projectId: "bd-concurso",
        storageBucket: "bd-concurso.firebasestorage.app",
        messagingSenderId: "944372990629",
        appId: "1:944372990629:web:1bd61c44cf1274eadc034c",
        measurementId: "G-LMSMQBD5CL"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app); // INICIAMOS LA BASE DE DATOS

      document.getElementById('signup-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('signup-email').value;
        const password = document.getElementById('signup-password').value;
        const rol = document.getElementById('signup-rol').value; // SACAMOS EL ROL ELEGIDO
        const msgDiv = document.getElementById('signup-message');

        msgDiv.innerHTML = "<p class='has-text-info'>Configurando tu cuenta...</p>";

        createUserWithEmailAndPassword(auth, email, password)
          .then(async (userCredential) => {
            const user = userCredential.user;
            
            // GUARDAMOS EL ROL EN LA BASE DE DATOS
            await setDoc(doc(db, "usuarios", user.uid), {
              correo: email,
              rol: rol
            });

            msgDiv.innerHTML = "<p class='has-text-success has-text-weight-bold'>¡Cuenta creada con éxito! Llevándote a tu panel...</p>";
            setTimeout(() => {
              if (rol === 'donador') window.location.href = "panel_donador.html";
              else if (rol === 'receptor') window.location.href = "panel_receptor.html";
              else if (rol === 'repartidor') window.location.href = "panel_repartidor.html";
              else window.location.href = "index.html"; 
            }, 2000);
          })
          .catch((error) => {
            msgDiv.innerHTML = `<p class='has-text-danger'>Error: ${error.message}</p>`;
          });
      });
    </script>
  </body>
</html>
