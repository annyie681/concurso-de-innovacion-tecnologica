<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="assets/css/bulma.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
    <style>
      .bg-base { background-color: #FFBDB0 !important; }
      .texto-rojo { color: #A31F05 !important; }
      .box { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
  </head>
  <body>
    <section class="hero bg-base is-fullheight">
      <div class="hero-body">
        <div class="container">
          <div class="columns is-centered">
            <div class="column is-4-desktop">
              <div class="box p-6">
                <h1 class="title has-text-centered texto-rojo mb-5">Iniciar Sesión</h1>
                
                <form id="login-form">
                  <div class="field">
                    <label class="label">Correo electrónico</label>
                    <div class="control has-icons-left">
                      <input class="input" type="email" id="login-email" placeholder="ejemplo@correo.com" required>
                      <span class="icon is-small is-left"><i class="fa-solid fa-envelope"></i></span>
                    </div>
                  </div>

                  <div class="field">
                    <label class="label">Contraseña</label>
                    <div class="control has-icons-left">
                      <input class="input" type="password" id="login-password" placeholder="********" required>
                      <span class="icon is-small is-left"><i class="fa-solid fa-lock"></i></span>
                    </div>
                  </div>

                  <div id="login-message" class="has-text-centered mb-3 mt-4"></div>

                  <div class="field mt-5">
                    <button type="submit" class="button is-primary is-fullwidth"><strong>Entrar</strong></button>
                  </div>
                </form>

                <p class="has-text-centered mt-4">
                  ¿No tienes cuenta? <a href="registro.html" class="texto-rojo has-text-weight-bold">Regístrate</a>
                </p>
                <p class="has-text-centered mt-2">
                  <a href="index.html" class="has-text-grey">Volver al inicio</a>
                </p>

              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Scripts de Firebase -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
      import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
      // IMPORTAMOS FIRESTORE PARA LEER EL ROL
      import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDRWBaRl4s0pNrf1ni16AP4oVb8iDEVmog",
        authDomain: "bd-concurso.firebaseapp.com",
        projectId: "bd-concurso",
        storageBucket: "bd-concurso.firebasestorage.app",
        messagingSenderId: "944372990629",
        appId: "1:944372990629:web:1bd61c44cf1274eadc034c",
        measurementId: "G-LMSMQBD5CL"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      document.getElementById('login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const msgDiv = document.getElementById('login-message');

        msgDiv.innerHTML = "<p class='has-text-info'>Iniciando sesión...</p>";

        signInWithEmailAndPassword(auth, email, password)
          .then(async (userCredential) => {
            msgDiv.innerHTML = "<p class='has-text-info'>Verificando tu tipo de cuenta...</p>";
            
            const user = userCredential.user;
            
            try {
              // BUSCAMOS AL USUARIO EN LA BASE DE DATOS
              const docRef = doc(db, "usuarios", user.uid);
              const docSnap = await getDoc(docRef);

              if (docSnap.exists()) {
                const rol = docSnap.data().rol;
                msgDiv.innerHTML = "<p class='has-text-success has-text-weight-bold'>¡Bienvenido! Cargando tu panel...</p>";
                
                // REDIRECCIÓN INTELIGENTE DEPENDIENDO DEL ROL
                setTimeout(() => {
                  if (rol === 'donador') {
                    window.location.href = "panel_donador.html";
                  } else if (rol === 'receptor') {
                    window.location.href = "panel_receptor.html";
                  } else if (rol === 'repartidor') {
                    window.location.href = "panel_repartidor.html";
                  } else {
                    // Por si acaso alguien no tiene rol
                    window.location.href = "index.html"; 
                  }
                }, 1500);

              } else {
                msgDiv.innerHTML = "<p class='has-text-warning'>Cuenta sin rol asignado.</p>";
                setTimeout(() => { window.location.href = "index.html"; }, 1500);
              }
            } catch (error) {
              console.error("Error al obtener el rol:", error);
              msgDiv.innerHTML = "<p class='has-text-danger'>Hubo un problema al cargar tus datos.</p>";
            }
          })
          .catch((error) => {
            if(error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password'){
               msgDiv.innerHTML = `<p class='has-text-danger'>Correo o contraseña incorrectos.</p>`;
            } else {
               msgDiv.innerHTML = `<p class='has-text-danger'>Error: ${error.message}</p>`;
            }
          });
      });
    </script>
  </body>
</html>
