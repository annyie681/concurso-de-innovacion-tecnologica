<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar Sesión - Fundación DDA</title>
    <link rel="stylesheet" href="assets/css/bulma.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
      integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      body {
        background-color: #FFBDB0 !important;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .texto-rojo {
        color: #A31F05 !important;
      }
      .texto-verde {
        color: #2D4F00 !important;
      }
      .btn-rojo {
        background-color: #A31F05 !important;
        color: #ffffff !important;
      }
    </style>
  </head>
  <body>
    <section class="section" style="width: 100%;">
      <div class="container">
        <div class="columns is-centered">
          <div class="column is-5-tablet is-4-desktop">
            <div class="box p-5">
              <div class="has-text-centered mb-4">
                <span class="icon is-large texto-rojo">
                  <i class="fa-solid fa-hand-holding-heart fa-2x"></i>
                </span>
                <h2 class="title is-3 texto-verde mt-2">Iniciar Sesión</h2>
                <p class="subtitle is-6 has-text-grey">
                  Acceso para supermercados, albergues y voluntarios verificados
                </p>
              </div>

              <form id="form-login">
                <div class="field">
                  <label class="label">Correo electrónico</label>
                  <div class="control has-icons-left">
                    <input
                      class="input"
                      type="email"
                      id="login-email"
                      placeholder="correo@ejemplo.com"
                      required
                    />
                    <span class="icon is-small is-left">
                      <i class="fa-solid fa-envelope"></i>
                    </span>
                  </div>
                </div>

                <div class="field">
                  <label class="label">Contraseña</label>
                  <div class="control has-icons-left">
                    <input
                      class="input"
                      type="password"
                      id="login-password"
                      placeholder="********"
                      required
                    />
                    <span class="icon is-small is-left">
                      <i class="fa-solid fa-lock"></i>
                    </span>
                  </div>
                </div>

                <div
                  id="mensaje-error"
                  class="notification is-danger is-light is-hidden mt-3 p-3 is-size-6"
                ></div>

                <button
                  type="submit"
                  id="btn-entrar"
                  class="button btn-rojo is-fullwidth is-medium mt-4"
                >
                  <strong>Entrar a mi Panel</strong>
                </button>

                <div class="has-text-centered mt-4">
                  <a href="index.html" class="has-text-grey is-size-6">
                    ← Volver al inicio / Crear cuenta
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Lógica de Firebase para Login y Redirección por Rol -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
      import {
        getAuth,
        signInWithEmailAndPassword
      } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
      import {
        getFirestore,
        doc,
        getDoc
      } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDRWBaRl4s0pNrf1ni16AP4oVb8iDEVmog",
        authDomain: "bd-concurso.firebaseapp.com",
        projectId: "bd-concurso",
        storageBucket: "bd-concurso.firebasestorage.app",
        messagingSenderId: "944372990629",
        appId: "1:944372990629:web:1bd61c44cf1274eadc034c",
        measurementId: "G-LMSMQBD5CL"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const formLogin = document.getElementById("form-login");
      const cajaError = document.getElementById("mensaje-error");
      const btnEntrar = document.getElementById("btn-entrar");

      function mostrarError(msg) {
        cajaError.innerText = msg;
        cajaError.classList.remove("is-hidden");
        btnEntrar.disabled = false;
        btnEntrar.innerHTML = "<strong>Entrar a mi Panel</strong>";
      }

      formLogin.addEventListener("submit", async (e) => {
        e.preventDefault();
        cajaError.classList.add("is-hidden");
        btnEntrar.disabled = true;
        btnEntrar.innerText = "Verificando acceso...";

        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;

        try {
          // 1. Iniciar sesión en Firebase Auth
          const credencial = await signInWithEmailAndPassword(auth, email, password);
          const uid = credencial.user.uid;

          // 2. Consultar el rol y estado de verificación en Firestore
          const userDoc = await getDoc(doc(db, "usuarios", uid));

          if (!userDoc.exists()) {
            return mostrarError(
              "Tu usuario no tiene un perfil asignado en la base de datos. Regístrate nuevamente."
            );
          }

          const datos = userDoc.data();
          const rol = datos.rol;

          // 3. Redirigir al panel correspondiente según su rol
          if (rol === "donador") {
            window.location.assign("panel_donador.html");
          } else if (rol === "receptor") {
            window.location.assign("panel_receptor.html");
          } else if (rol === "repartidor") {
            window.location.assign("panel_repartidor.html");
          } else {
            window.location.assign("index.html");
          }
        } catch (error) {
          if (
            error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found"
          ) {
            mostrarError("Correo o contraseña incorrectos.");
          } else {
            mostrarError("Error al iniciar sesión: " + error.message);
          }
        }
      });
    </script>
  </body>
</html>
