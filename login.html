<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar Sesión - Fundación DDA</title>
    <link rel="stylesheet" href="assets/css/bulma.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
      crossorigin="anonymous"
    />
    <style>
      body {
        background-color: #FFBDB0 !important;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .texto-rojo { color: #A31F05 !important; }
      .texto-verde { color: #2D4F00 !important; }
      .btn-rojo { background-color: #A31F05 !important; color: #ffffff !important; }
    </style>
  </head>
  <body>
    <section class="section" style="width: 100%;">
      <div class="container">
        <div class="columns is-centered">
          <div class="column is-5-tablet is-4-desktop">
            <div class="box p-5">
              <div class="has-text-centered mb-4">
                <span class="icon is-large texto-rojo">
                  <i class="fa-solid fa-hand-holding-heart fa-2x"></i>
                </span>
                <h2 class="title is-3 texto-verde mt-2">Iniciar Sesión</h2>
                <p class="subtitle is-6 has-text-grey">
                  Acceso para supermercados, albergues y voluntarios verificados
                </p>
              </div>

              <form id="form-login">
                <div class="field">
                  <label class="label">Correo electrónico</label>
                  <div class="control has-icons-left">
                    <input class="input" type="email" id="login-email" placeholder="correo@ejemplo.com" required />
                    <span class="icon is-small is-left"><i class="fa-solid fa-envelope"></i></span>
                  </div>
                </div>

                <div class="field">
                  <label class="label">Contraseña</label>
                  <div class="control has-icons-left">
                    <input class="input" type="password" id="login-password" placeholder="********" required />
                    <span class="icon is-small is-left"><i class="fa-solid fa-lock"></i></span>
                  </div>
                </div>

                <!-- Si la cuenta venía de una prueba sin documento en Firestore, permite elegir a qué panel ir -->
                <div class="field is-hidden" id="contenedor-rol-recuperacion">
                  <label class="label texto-rojo">Selecciona tu perfil para vincular tu cuenta:</label>
                  <div class="control">
                    <div class="select is-fullwidth">
                      <select id="rol-recuperacion">
                        <option value="donador">Supermercado (Donador)</option>
                        <option value="receptor">Albergue / Comedor (Receptor)</option>
                        <option value="repartidor">Voluntario (Repartidor)</option>
                      </select>
                    </div>
                  </div>
                </div>

                <div id="mensaje-error" class="notification is-danger is-light is-hidden mt-3 p-3 is-size-6"></div>

                <button type="submit" id="btn-entrar" class="button btn-rojo is-fullwidth is-medium mt-4">
                  <strong>Entrar a mi Panel</strong>
                </button>

                <div class="has-text-centered mt-4">
                  <a href="index.html" class="has-text-grey is-size-6">← Volver al inicio / Crear cuenta</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
      import {
        getAuth,
        setPersistence,
        browserLocalPersistence,
        signInWithEmailAndPassword
      } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
      import {
        getFirestore,
        doc,
        getDoc,
        setDoc
      } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDRWBaRl4s0pNrf1ni16AP4oVb8iDEVmog",
        authDomain: "bd-concurso.firebaseapp.com",
        projectId: "bd-concurso",
        storageBucket: "bd-concurso.firebasestorage.app",
        messagingSenderId: "944372990629",
        appId: "1:944372990629:web:1bd61c44cf1274eadc034c",
        measurementId: "G-LMSMQBD5CL"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const formLogin = document.getElementById("form-login");
      const cajaError = document.getElementById("mensaje-error");
      const btnEntrar = document.getElementById("btn-entrar");
      const contenedorRecuperacion = document.getElementById("contenedor-rol-recuperacion");
      const selectRecuperacion = document.getElementById("rol-recuperacion");

      function mostrarError(msg) {
        cajaError.innerText = msg;
        cajaError.classList.remove("is-hidden");
        btnEntrar.disabled = false;
        btnEntrar.innerHTML = "<strong>Entrar a mi Panel</strong>";
      }

      formLogin.addEventListener("submit", async (e) => {
        e.preventDefault();
        cajaError.classList.add("is-hidden");
        btnEntrar.disabled = true;
        btnEntrar.innerText = "Abriendo tu panel...";

        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;

        try {
          // 1. Forzar persistencia en LocalStorage para que los paneles no pierdan la sesión
          await setPersistence(auth, browserLocalPersistence);

          // 2. Iniciar sesión en Firebase Auth
          const credencial = await signInWithEmailAndPassword(auth, email, password);
          const uid = credencial.user.uid;

          // 3. Consultar perfil en Firestore
          let userDoc = await getDoc(doc(db, "usuarios", uid));
          let datos;

          // Si el usuario existía en Auth pero su documento de Firestore se había borrado, lo recreamos
          if (!userDoc.exists()) {
            if (contenedorRecuperacion.classList.contains("is-hidden")) {
              contenedorRecuperacion.classList.remove("is-hidden");
              return mostrarError("Selecciona abajo qué tipo de usuario eres y vuelve a darle clic a 'Entrar a mi Panel'.");
            }
            const rolElegido = selectRecuperacion.value;
            datos = {
              nombre: email.split("@")[0],
              email: email,
              rol: rolElegido,
              rfc: "CLE810525EA1",
              verificado: true,
              fechaRegistro: new Date().toISOString()
            };
            await setDoc(doc(db, "usuarios", uid), datos);
          } else {
            datos = userDoc.data();
          }

          // 4. Guardar respaldo en localStorage para que el panel cargue instantáneamente sin rebotar
          localStorage.setItem("dda_sesion_activa", JSON.stringify({
            uid: uid,
            email: email,
            nombre: datos.nombre || email,
            rol: datos.rol,
            rfc: datos.rfc || "Autorizado",
            codigoUsado: datos.codigoUsado || "VOL-ACTIVO",
            supermercadoNombre: datos.supermercadoNombre || "Supermercado Verificado"
          }));

          // 5. Redirigir al panel correspondiente
          if (datos.rol === "donador") {
            window.location.href = "panel_donador.html";
          } else if (datos.rol === "receptor") {
            window.location.href = "panel_receptor.html";
          } else if (datos.rol === "repartidor") {
            window.location.href = "panel_repartidor.html";
          } else {
            window.location.href = "panel_donador.html";
          }
        } catch (error) {
          if (
            error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found"
          ) {
            mostrarError("Correo o contraseña incorrectos.");
          } else {
            mostrarError("Error al iniciar sesión: " + error.message);
          }
        }
      });
    </script>
  </body>
</html>
