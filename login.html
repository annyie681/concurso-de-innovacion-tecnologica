<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="assets/css/bulma.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
    <style>
      .bg-base {
        background-color: #FFBDB0 !important;
      }
      .texto-rojo {
        color: #A31F05 !important;
      }
      .box {
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      }
    </style>
  </head>
  <body>
    <section class="hero bg-base is-fullheight">
      <div class="hero-body">
        <div class="container">
          <div class="columns is-centered">
            <div class="column is-4-desktop">
              <div class="box p-6">
                <h1 class="title has-text-centered texto-rojo mb-5">Iniciar Sesión</h1>
                
                <form>
                  <div class="field">
                    <label class="label">Correo electrónico</label>
                    <div class="control has-icons-left">
                      <input class="input" type="email" placeholder="ejemplo@correo.com">
                      <span class="icon is-small is-left"><i class="fa-solid fa-envelope"></i></span>
                    </div>
                  </div>

                  <div class="field">
                    <label class="label">Contraseña</label>
                    <div class="control has-icons-left">
                      <input class="input" type="password" placeholder="********">
                      <span class="icon is-small is-left"><i class="fa-solid fa-lock"></i></span>
                    </div>
                  </div>

                  <div class="field mt-5">
                    <button class="button is-primary is-fullwidth"><strong>Entrar</strong></button>
                  </div>
                </form>

                <p class="has-text-centered mt-4">
                  ¿No tienes cuenta? <a href="registro.html" class="texto-rojo has-text-weight-bold">Regístrate</a>
                </p>
                <p class="has-text-centered mt-2">
                  <a href="index.html" class="has-text-grey">Volver al inicio</a>
                </p>

              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
