<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panel de Voluntario - Repartidor</title>
    <link rel="stylesheet" href="assets/css/bulma.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
    <style>
      .bg-base { background-color: #FFBDB0 !important; }
      .texto-rojo { color: #A31F05 !important; }
      .box { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
      #panel-content { display: none; }
    </style>
  </head>
  <body class="bg-base">
    
    <nav class="navbar is-white" style="border-radius: 0 0 15px 15px; margin-bottom: 2rem; padding: 0.5rem 2rem;">
      <div class="navbar-brand">
        <a class="navbar-item texto-rojo has-text-weight-bold is-size-4" href="index.html">
          <i class="fa-solid fa-car-side mr-2"></i> Inicio
        </a>
      </div>
      <div class="navbar-menu is-active" style="background: transparent; box-shadow: none;">
        <div class="navbar-end">
          <div class="navbar-item">
            <span class="tag is-light is-medium mr-4 texto-rojo">Perfil: Voluntario</span>
            <button id="btn-cerrar-sesion" class="button is-danger is-outlined">
              <i class="fa-solid fa-right-from-bracket mr-2"></i> Salir
            </button>
          </div>
        </div>
      </div>
    </nav>

    <section class="section pt-0" id="panel-content">
      <div class="container">
        
        <div class="columns is-vcentered mb-5">
          <div class="column is-8">
            <h1 class="title texto-rojo">¡Qué onda! <span id="user-email" class="is-size-4 has-text-weight-normal"></span></h1>
          </div>
          <div class="column is-4 has-text-right">
            <span class="tag is-success is-large"><i class="fa-solid fa-medal mr-2"></i> Listo para ayudar</span>
          </div>
        </div>

        <div class="columns is-variable is-6">
          <!-- Rutas Disponibles -->
          <div class="column is-6">
            <div class="box p-5" style="height: 100%;">
              <h2 class="title is-4 texto-rojo"><i class="fa-solid fa-map-location mr-2"></i> Viajes Disponibles</h2>
              <p class="mb-4 has-text-grey is-size-7">Donaciones que ya fueron reclamadas por un albergue y necesitan traslado.</p>
              
              <div id="contenedor-rutas">
                <p class="has-text-grey has-text-centered mt-5">Buscando rutas...</p>
              </div>
            </div>
          </div>

          <!-- Viaje Activo -->
          <div class="column is-6">
            <div class="box p-5" style="height: 100%; background-color: #fcfcfc;">
              <h2 class="title is-4 texto-rojo"><i class="fa-solid fa-steering-wheel mr-2"></i> Tu Viaje Actual</h2>
              
              <div id="contenedor-viaje-activo">
                <div class="notification is-light is-size-7 mt-5">
                  Acepta un viaje de la lista de la izquierda para comenzar.
                </div>
              </div>

            </div>
          </div>
        </div>

      </div>
    </section>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
      import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
      import { getFirestore, collection, onSnapshot, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDRWBaRl4s0pNrf1ni16AP4oVb8iDEVmog",
        authDomain: "bd-concurso.firebaseapp.com",
        projectId: "bd-concurso",
        storageBucket: "bd-concurso.firebasestorage.app",
        messagingSenderId: "944372990629",
        appId: "1:944372990629:web:1bd61c44cf1274eadc034c"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      let currentUser = null;
      let miLat = 0, miLng = 0;

      function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371; 
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return (R * c).toFixed(1); 
      }

      onAuthStateChanged(auth, (user) => {
        if (user) {
          currentUser = user;
          document.getElementById('panel-content').style.display = 'block';
          document.getElementById('user-email').innerText = user.email;

          navigator.geolocation.getCurrentPosition((pos) => {
            miLat = pos.coords.latitude;
            miLng = pos.coords.longitude;

            onSnapshot(collection(db, "alertas"), (snapshot) => {
              const rutas = document.getElementById('contenedor-rutas');
              const viaje = document.getElementById('contenedor-viaje-activo');
              rutas.innerHTML = ''; 
              let tieneViajeActivo = false;

              snapshot.forEach((docSnap) => {
                const alerta = docSnap.data();
                const id = docSnap.id;
                
                let distancia = alerta.latitud ? calcularDistancia(miLat, miLng, alerta.latitud, alerta.longitud) : "N/A ";

                // 1. Mostrar viajes disponibles (Tienen receptor pero no repartidor)
                if (alerta.receptorId && !alerta.repartidorId) {
                  rutas.innerHTML += `
                    <div class="box mb-4" style="border: 2px dashed #3298dc; background-color: #f5faff;">
                      <div class="columns is-mobile is-vcentered">
                        <div class="column is-8">
                          <p class="has-text-weight-bold is-size-5">${alerta.peso}kg de ${alerta.descripcion}</p>
                          <p class="is-size-7 has-text-grey mt-2">
                            <strong class="texto-rojo">A:</strong> ${alerta.donadorEmail}<br>
                            <strong class="has-text-info">B:</strong> ${alerta.receptorEmail}
                          </p>
                        </div>
                        <div class="column is-4 has-text-right">
                          <span class="tag is-info is-light mb-2"><i class="fa-solid fa-route mr-1"></i> a ${distancia} km</span><br>
                          <button class="button is-info is-small" onclick="window.aceptarViaje('${id}')"><strong>Aceptar Viaje</strong></button>
                        </div>
                      </div>
                    </div>
                  `;
                }

                // 2. Mostrar el viaje que este voluntario está haciendo
                if (alerta.repartidorId === currentUser.uid && alerta.estado !== 'Entregado') {
                  tieneViajeActivo = true;
                  
                  let botonFinal = alerta.estado === 'En camino a recolectar' 
                    ? `<button class="button is-success is-fullwidth is-outlined mt-4" disabled><i class="fa-solid fa-lock mr-2"></i> Valida el PIN primero para entregar</button>`
                    : `<button class="button is-success is-fullwidth mt-4" onclick="window.marcarEntregado('${id}')"><i class="fa-solid fa-check mr-2"></i> Marcar como Entregado en Albergue</button>`;

                  let inputPin = alerta.estado === 'En camino a recolectar'
                    ? `<p class="is-size-7 has-text-weight-bold mb-2">Validación de Recolección (Antirrobo)</p>
                       <div class="field has-addons">
                         <div class="control is-expanded"><input class="input is-small" type="text" id="input-pin" placeholder="PIN que te dará el gerente"></div>
                         <div class="control"><button class="button is-warning is-small" onclick="window.validarPin('${id}')"><strong>Validar</strong></button></div>
                       </div>`
                    : `<div class="notification is-success is-light"><i class="fa-solid fa-shield-check"></i> PIN Validado. ¡Llévalo al albergue!</div>`;

                  viaje.innerHTML = `
                    <div class="box mb-3" style="border-left: 5px solid #ffdd57;">
                      <p class="has-text-weight-bold mb-2">${alerta.peso}kg de ${alerta.descripcion}</p>
                      <p class="is-size-7 has-text-grey mb-4"><i class="fa-solid fa-location-dot mr-1"></i> Súper: <strong>${alerta.donadorEmail}</strong><br><i class="fa-solid fa-flag-checkered mr-1"></i> Albergue: <strong>${alerta.receptorEmail}</strong></p>
                      <hr>
                      ${inputPin}
                    </div>
                    ${botonFinal}
                  `;
                }
              });

              if (rutas.innerHTML === '') rutas.innerHTML = '<p class="has-text-grey has-text-centered mt-5">No hay rutas pendientes por ahora.</p>';
              if (!tieneViajeActivo) viaje.innerHTML = '<div class="notification is-light is-size-7 mt-5">Acepta un viaje de la lista de la izquierda para comenzar.</div>';
            });
          });
        } else {
          window.location.href = "login.html";
        }
      });

      window.aceptarViaje = async function(idAlerta) {
        try {
          await updateDoc(doc(db, "alertas", idAlerta), { repartidorId: currentUser.uid, estado: 'En camino a recolectar' });
        } catch (error) { console.error(error); }
      };

      window.validarPin = async function(idAlerta) {
        const pinIngresado = document.getElementById('input-pin').value;
        const alertaSnap = await getDoc(doc(db, "alertas", idAlerta));
        
        if(alertaSnap.exists() && alertaSnap.data().pinSeguridad === pinIngresado) {
          await updateDoc(doc(db, "alertas", idAlerta), { estado: 'En camino al albergue' });
          alert("PIN Correcto. ¡Ya puedes llevar la comida al albergue!");
        } else {
          alert("PIN Incorrecto. Verifica con el gerente del súper.");
        }
      };

      window.marcarEntregado = async function(idAlerta) {
        try {
          await updateDoc(doc(db, "alertas", idAlerta), { estado: 'Entregado' });
          alert("¡Misión Cumplida! Gracias por ayudar.");
        } catch (error) { console.error(error); }
      };

      document.getElementById('btn-cerrar-sesion').addEventListener('click', () => { signOut(auth).then(() => { window.location.href = "index.html"; }); });
    </script>
  </body>
</html>
