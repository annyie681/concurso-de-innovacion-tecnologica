<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panel de Donador - Súper</title>
    <link rel="stylesheet" href="assets/css/bulma.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
    <style>
      .bg-base { background-color: #FFBDB0 !important; }
      .texto-rojo { color: #A31F05 !important; }
      .box { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
      #panel-content { display: none; }
    </style>
  </head>
  <body class="bg-base">
    
    <nav class="navbar is-white" style="border-radius: 0 0 15px 15px; margin-bottom: 2rem; padding: 0.5rem 2rem;">
      <div class="navbar-brand">
        <a class="navbar-item texto-rojo has-text-weight-bold is-size-4" href="index.html">
          <i class="fa-solid fa-leaf mr-2"></i> Inicio
        </a>
      </div>
      <div class="navbar-menu is-active" style="background: transparent; box-shadow: none;">
        <div class="navbar-end">
          <div class="navbar-item">
            <span class="tag is-light is-medium mr-4 texto-rojo">Perfil: Súper/Donador</span>
            <button id="btn-cerrar-sesion" class="button is-danger is-outlined">
              <i class="fa-solid fa-right-from-bracket mr-2"></i> Salir
            </button>
          </div>
        </div>
      </div>
    </nav>

    <section class="section pt-0" id="panel-content">
      <div class="container">
        <h1 class="title texto-rojo mb-5">¡Hola de nuevo! <span id="user-email" class="is-size-4 has-text-weight-normal"></span></h1>

        <div class="columns mb-5">
          <div class="column is-4">
            <div class="box has-text-centered">
              <p class="heading">Comida Salvada</p>
              <p class="title texto-rojo"><span id="stat-kilos">0</span> kg</p>
            </div>
          </div>
          <div class="column is-4">
            <div class="box has-text-centered">
              <p class="heading">Alertas Emitidas</p>
              <p class="title texto-rojo" id="stat-alertas">0</p>
            </div>
          </div>
          <div class="column is-4">
            <div class="box has-text-centered">
              <p class="heading">Estado GPS</p>
              <p class="title texto-rojo is-size-5 mt-2" id="gps-status">Cargando...</p>
            </div>
          </div>
        </div>

        <div class="columns is-variable is-6">
          <div class="column is-5">
            <div class="box p-5" style="height: 100%;">
              <h2 class="title is-4 texto-rojo"><i class="fa-solid fa-bullhorn mr-2"></i> Emitir Alerta</h2>
              <form id="form-alerta">
                <div class="field">
                  <label class="label">Descripción del Alimento</label>
                  <div class="control has-icons-left">
                    <input class="input" type="text" id="alerta-desc" placeholder="Ej. 2 cajas de pan..." required>
                    <span class="icon is-small is-left"><i class="fa-solid fa-carrot"></i></span>
                  </div>
                </div>
                <div class="columns">
                  <div class="column">
                    <div class="field">
                      <label class="label">Peso (kg)</label>
                      <div class="control">
                        <input class="input" type="number" id="alerta-peso" placeholder="Ej. 20" required>
                      </div>
                    </div>
                  </div>
                  <div class="column">
                    <div class="field">
                      <label class="label">Caduca en</label>
                      <div class="control">
                        <div class="select is-fullwidth">
                          <select id="alerta-tiempo">
                            <option value="72">72 horas</option>
                            <option value="48">48 horas</option>
                            <option value="24">24 horas</option>
                          </select>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <button type="submit" id="btn-lanzar" class="button is-info is-fullwidth is-medium mt-4">
                  <strong><i class="fa-solid fa-paper-plane mr-2"></i> Lanzar Alerta</strong>
                </button>
              </form>
            </div>
          </div>

          <div class="column is-7">
            <div class="box p-5" style="height: 100%; background-color: #fcfcfc;">
              <h2 class="title is-4 texto-rojo"><i class="fa-solid fa-route mr-2"></i> Monitor de Trazabilidad</h2>
              <div id="contenedor-monitor"><p class="has-text-grey has-text-centered mt-6">Cargando alertas...</p></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
      import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
      import { getFirestore, collection, addDoc, serverTimestamp, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDRWBaRl4s0pNrf1ni16AP4oVb8iDEVmog",
        authDomain: "bd-concurso.firebaseapp.com",
        projectId: "bd-concurso",
        storageBucket: "bd-concurso.firebasestorage.app",
        messagingSenderId: "944372990629",
        appId: "1:944372990629:web:1bd61c44cf1274eadc034c"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      let currentUser = null;
      let miLat = null, miLng = null;

      // Obtener GPS al abrir la página
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => { miLat = pos.coords.latitude; miLng = pos.coords.longitude; document.getElementById('gps-status').innerHTML = 'Activo <i class="fa-solid fa-circle-check has-text-success"></i>'; },
          (err) => { document.getElementById('gps-status').innerHTML = 'Inactivo <i class="fa-solid fa-circle-xmark has-text-danger"></i>'; }
        );
      } else {
        document.getElementById('gps-status').innerHTML = 'No Soportado';
      }

      onAuthStateChanged(auth, (user) => {
        if (user) {
          currentUser = user;
          document.getElementById('panel-content').style.display = 'block';
          document.getElementById('user-email').innerText = user.email;

          const q = query(collection(db, "alertas"), where("donadorId", "==", user.uid));
          onSnapshot(q, (snapshot) => {
            const contenedor = document.getElementById('contenedor-monitor');
            contenedor.innerHTML = ''; 
            let totalKilos = 0; let totalAlertas = 0;

            if (snapshot.empty) contenedor.innerHTML = '<p class="has-text-grey has-text-centered mt-6">No tienes alertas activas.</p>';

            snapshot.forEach((doc) => {
              const alerta = doc.data();
              totalAlertas++;
              totalKilos += Number(alerta.peso);

              let colorBorde = alerta.estado === 'Entregado' ? '#00d1b2' : (alerta.estado === 'Buscando Repartidor' ? '#ffdd57' : '#48c774');
              let tagEstado = `<span class="tag is-success mb-2">${alerta.estado}</span>`;
              if (alerta.estado === 'Buscando Repartidor') tagEstado = `<span class="tag is-warning">Buscando Repartidor</span>`;
              
              contenedor.innerHTML += `
                <div class="box mb-3" style="border-left: 5px solid ${colorBorde};">
                  <div class="columns is-vcentered">
                    <div class="column is-7">
                      <p class="has-text-weight-bold">${alerta.peso}kg de ${alerta.descripcion}</p>
                    </div>
                    <div class="column is-5 has-text-right">${tagEstado}<br><span class="is-size-7">PIN: <strong class="texto-rojo">${alerta.pinSeguridad}</strong></span></div>
                  </div>
                </div>`;
            });
            document.getElementById('stat-kilos').innerText = totalKilos;
            document.getElementById('stat-alertas').innerText = totalAlertas;
          });
        } else { window.location.href = "login.html"; }
      });

      document.getElementById('form-alerta').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btnLanzar = document.getElementById('btn-lanzar');
        btnLanzar.classList.add('is-loading'); 

        try {
          await addDoc(collection(db, "alertas"), {
            descripcion: document.getElementById('alerta-desc').value,
            peso: Number(document.getElementById('alerta-peso').value),
            tiempoCaducidad: document.getElementById('alerta-tiempo').value,
            donadorId: currentUser.uid, donadorEmail: currentUser.email,
            estado: 'Buscando Repartidor',
            pinSeguridad: Math.floor(1000 + Math.random() * 9000).toString(), 
            latitud: miLat, longitud: miLng,
            fechaCreacion: serverTimestamp()
          });
          document.getElementById('form-alerta').reset();
        } catch (error) { alert("Error al guardar en base de datos."); }
        btnLanzar.classList.remove('is-loading');
      });

      document.getElementById('btn-cerrar-sesion').addEventListener('click', () => { signOut(auth); });
    </script>
  </body>
</html>
