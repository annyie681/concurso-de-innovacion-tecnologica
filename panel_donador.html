<script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
      import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
      import { getFirestore, collection, addDoc, serverTimestamp, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDRWBaRl4s0pNrf1ni16AP4oVb8iDEVmog",
        authDomain: "bd-concurso.firebaseapp.com",
        projectId: "bd-concurso",
        storageBucket: "bd-concurso.firebasestorage.app",
        messagingSenderId: "944372990629",
        appId: "1:944372990629:web:1bd61c44cf1274eadc034c"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      let currentUser = null;

      onAuthStateChanged(auth, (user) => {
        if (user) {
          currentUser = user;
          document.getElementById('panel-content').style.display = 'block';
          document.getElementById('user-email').innerText = user.email;

          const q = query(collection(db, "alertas"), where("donadorId", "==", user.uid));
          onSnapshot(q, (snapshot) => {
            const contenedor = document.getElementById('contenedor-monitor');
            contenedor.innerHTML = ''; 
            let totalKilos = 0; let totalAlertas = 0;

            if (snapshot.empty) {
              contenedor.innerHTML = '<p class="has-text-grey has-text-centered mt-6">No tienes alertas activas. ¡Lanza una!</p>';
            }

            snapshot.forEach((doc) => {
              const alerta = doc.data();
              totalAlertas++;
              totalKilos += Number(alerta.peso);

              let colorBorde = alerta.estado === 'Buscando Repartidor' ? '#ffdd57' : '#48c774';
              let tagEstado = alerta.estado === 'Buscando Repartidor' 
                ? '<span class="tag is-warning"><i class="fa-solid fa-magnifying-glass mr-1"></i> Buscando Repartidor</span>' 
                : `<span class="tag is-success mb-2"><i class="fa-solid fa-truck-fast mr-1"></i> ${alerta.estado}</span><br><span class="is-size-7 has-text-weight-bold">PIN: <span class="texto-rojo">${alerta.pinSeguridad || '---'}</span></span>`;

              contenedor.innerHTML += `
                <div class="box mb-3" style="border-left: 5px solid ${colorBorde};">
                  <div class="columns is-vcentered">
                    <div class="column is-7">
                      <p class="has-text-weight-bold">${alerta.peso}kg de ${alerta.descripcion}</p>
                      <p class="is-size-7 has-text-grey">Límite: ${alerta.tiempoCaducidad} horas</p>
                    </div>
                    <div class="column is-5 has-text-right">${tagEstado}</div>
                  </div>
                </div>
              `;
            });
            document.getElementById('stat-kilos').innerText = totalKilos;
            document.getElementById('stat-alertas').innerText = totalAlertas;
          });
        } else {
          window.location.href = "login.html";
        }
      });

      document.getElementById('form-alerta').addEventListener('submit', (e) => {
        e.preventDefault();
        const btnLanzar = document.getElementById('btn-lanzar');
        btnLanzar.classList.add('is-loading'); 

        // AQUÍ ESTÁ LA MAGIA DEL GPS REAL
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(async (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            
            try {
              await addDoc(collection(db, "alertas"), {
                descripcion: document.getElementById('alerta-desc').value,
                peso: Number(document.getElementById('alerta-peso').value),
                tiempoCaducidad: document.getElementById('alerta-tiempo').value,
                donadorId: currentUser.uid,
                donadorEmail: currentUser.email,
                estado: 'Buscando Repartidor',
                pinSeguridad: Math.floor(1000 + Math.random() * 9000).toString(), 
                latitud: lat,  // Guardamos latitud real
                longitud: lng, // Guardamos longitud real
                fechaCreacion: serverTimestamp()
              });

              document.getElementById('alerta-desc').value = '';
              document.getElementById('alerta-peso').value = '';
              btnLanzar.classList.remove('is-loading');
            } catch (error) {
              console.error("Error al guardar: ", error);
              btnLanzar.classList.remove('is-loading');
            }
          }, (error) => {
            alert("Necesitas dar permiso de ubicación al navegador para lanzar la alerta.");
            btnLanzar.classList.remove('is-loading');
          });
        } else {
          alert("Tu navegador no soporta geolocalización.");
        }
      });

      document.getElementById('btn-cerrar-sesion').addEventListener('click', () => {
        signOut(auth).then(() => { window.location.href = "index.html"; });
      });
    </script>
